<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --ink: #071019;
      --soft: #546573;
      --blue: #3579ff;
      --violet: #6b52ff;
      --edge: rgba(255, 255, 255, 0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(140deg, #ebf6ff 0%, #f2eaff 55%, #e6f2ff 100%);
      color: var(--ink);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink);
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .card {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .balance-title { font-size: 11px; color: var(--soft); }
    .balance-val { font-size: 20px; font-weight: 700; color: var(--violet); margin-top: 2px; }
    .quick-links { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.sec {
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
      border: 1px solid var(--edge);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Quota.Hub</div>
    <span class="badge">En Ligne</span>
  </div>
  <div class="card">
    <div class="balance-title">Solde de tirage API actif</div>
    <div class="balance-val">$14.85</div>
  </div>
  <div class="quick-links">
    <button onclick="window.open('https://quotahub.eu/console')">Ouvrir Console</button>
    <button class="sec" onclick="window.open('https://quotahub.eu/recharge')">+ Recharger</button>
  </div>
</body>
</html>
